name: Verify CardioFlow
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Browser walkthroughs of clinical care
        run: |
          CARDIO_DATA_DIR=memory npx tsx server/index.ts > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4310/api/health && break; sleep 1; done
          mkdir -p screenshots && node scripts/shots.mjs screenshots
          node scripts/admission-shots.mjs screenshots/admission
          node scripts/entry-fixes.mjs screenshots/entry-fixes
          node scripts/phone-polish.mjs screenshots/phone-polish
          node scripts/af-care-check.mjs screenshots/af-care
          node scripts/structural-context-check.mjs screenshots/structural-context
          node scripts/hypertension-admin-check.mjs screenshots/hypertension-admin
          node scripts/date-journey-check.mjs screenshots/date-journey
          node scripts/overview-snapshots-check.mjs screenshots/overview-snapshots
          node scripts/journey-focus-check.mjs screenshots/journey-focus
          node scripts/lab-record-check.mjs screenshots/lab-record
          node scripts/flow-integrity-check.mjs screenshots/flow-integrity
          node scripts/round4-flow-check.mjs screenshots/round4-flow
          node scripts/round5-flow-check.mjs screenshots/round5-flow
          node scripts/round6-flow-check.mjs screenshots/round6-flow
          node scripts/past-admission-check.mjs screenshots/past-admission
          node scripts/labs-hypertension-check.mjs screenshots/labs-hypertension
          node scripts/audit-oct17-check.mjs screenshots/audit-oct17
          CARDIO_TEST_URL=http://127.0.0.1:4310 node scripts/cardiorenal-reconciliation-check.mjs screenshots/cardiorenal-reconciliation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walkthrough-screenshots
          path: screenshots/
          retention-days: 14
