name: Verify CardioFlow
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Browser walkthrough of the HF slice
        run: |
          CARDIO_DATA_DIR=memory npx tsx server/index.ts > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4310/api/health && break; sleep 1; done
          mkdir -p screenshots && node scripts/shots.mjs screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walkthrough-screenshots
          path: screenshots/
          retention-days: 14
