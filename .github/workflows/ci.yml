name: Verify CardioFlow
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
  # Runs beside `verify`, so a failing test or type error reports without waiting for the browser run.
  # The scripts stay in one job and one order: they share one in-memory server.
  walkthroughs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # some walkthroughs serve the built app from dist/
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser walkthroughs of clinical care
        run: |
          CARDIO_DATA_DIR=memory npx tsx server/index.ts > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4310/api/health && break; sleep 1; done
          # one retry per script: a dialog-timing wait fails now and then on the shared runner; a second failure is real
          run() { "$@" || { echo "::warning::retrying after a failure: $*"; "$@"; }; }
          mkdir -p screenshots && run node scripts/shots.mjs screenshots
          run node scripts/admission-shots.mjs screenshots/admission
          run node scripts/entry-fixes.mjs screenshots/entry-fixes
          run node scripts/phone-polish.mjs screenshots/phone-polish
          run node scripts/af-care-check.mjs screenshots/af-care
          run node scripts/structural-context-check.mjs screenshots/structural-context
          run node scripts/hypertension-admin-check.mjs screenshots/hypertension-admin
          run node scripts/date-journey-check.mjs screenshots/date-journey
          run node scripts/overview-snapshots-check.mjs screenshots/overview-snapshots
          run node scripts/journey-focus-check.mjs screenshots/journey-focus
          run node scripts/lab-record-check.mjs screenshots/lab-record
          run node scripts/flow-integrity-check.mjs screenshots/flow-integrity
          run node scripts/round4-flow-check.mjs screenshots/round4-flow
          run node scripts/round5-flow-check.mjs screenshots/round5-flow
          run node scripts/round6-flow-check.mjs screenshots/round6-flow
          run node scripts/past-admission-check.mjs screenshots/past-admission
          run node scripts/labs-hypertension-check.mjs screenshots/labs-hypertension
          run node scripts/audit-oct17-check.mjs screenshots/audit-oct17
          run node scripts/syncope-check.mjs screenshots/syncope
          run node scripts/aorta-check.mjs screenshots/aorta
          run node scripts/pericardial-check.mjs screenshots/pericardial
          run node scripts/medication-review-check.mjs screenshots/medication-review
          run env CARDIO_TEST_URL=http://127.0.0.1:4310 node scripts/cardiorenal-reconciliation-check.mjs screenshots/cardiorenal-reconciliation
          run node scripts/pregnancy-check.mjs screenshots/pregnancy
          run node scripts/audit-fixes-check.mjs screenshots/audit-fixes
          run node --import tsx scripts/all-pathways-decision-check.mjs screenshots/all-pathways
          run node scripts/simple-patient-flow-check.mjs screenshots/simple-patient-flow
          run node scripts/consult-audit-check.mjs screenshots/consult-audit
          run node scripts/refinement-oct29-check.mjs screenshots/refinement-oct29
          run node scripts/refinement-oct31-check.mjs screenshots/refinement-oct31
          run node scripts/all-lab-trends-check.mjs screenshots/all-lab-trends
          run node scripts/pathway-safety-round2-check.mjs screenshots/pathway-safety-round2
          run node --import tsx scripts/diagnosis-integrity-check.mjs screenshots/diagnosis-integrity
          run node scripts/registries-check.mjs screenshots/registries
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walkthrough-screenshots
          path: |
            screenshots/
            server.log
          retention-days: 14
