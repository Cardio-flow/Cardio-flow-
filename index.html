<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="theme-color" content="#0B2D5B" />
    <meta name="description" content="CardioFlow — longitudinal cardiology care, decisions and follow-up" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230B2D5B'/%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1'%3E%3Cstop offset='0' stop-color='%233FA3FF'/%3E%3Cstop offset='1' stop-color='%23FF4D4D'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M8 40 C 22 24, 38 22, 56 32 C 40 28, 24 30, 8 40 Z' fill='url(%23g)'/%3E%3C/svg%3E" />
    <title>CardioFlow</title>
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0b2d5b; font-family: system-ui; color: #fff">
        <div style="text-align: center">
          <div style="font-size: 40px; font-weight: 800; letter-spacing: -1.5px">Cardio<span style="color: #ff4d4d">flow</span></div>
          <p id="startup-status" style="color: #b8c9e2">Opening your workspace…</p>
          <button id="startup-reload" hidden style="height: 44px; padding: 0 18px; border-radius: 12px; border: 0; font-weight: 700">Reload</button>
          <noscript>Please enable JavaScript to open CardioFlow.</noscript>
        </div>
      </div>
    </div>
    <script>
      (() => {
        let ready = false;
        function failed() {
          if (ready) return;
          const status = document.getElementById("startup-status");
          const button = document.getElementById("startup-reload");
          if (status) status.textContent = "CardioFlow could not load. Reload to get the latest version.";
          if (button) {
            button.hidden = false;
            button.onclick = () => {
              const url = new URL(location.href);
              url.searchParams.set("reload", String(Date.now()));
              location.replace(url);
            };
          }
        }
        const timeout = setTimeout(failed, 20000);
        window.addEventListener("cardio:ready", () => { ready = true; clearTimeout(timeout); }, { once: true });
        window.addEventListener("error", (e) => { if (e.target && e.target.tagName === "SCRIPT") failed(); }, true);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
